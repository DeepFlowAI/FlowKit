name: server-vertex
description: "服务器压到顶点 — 忽略 scenario load.max，直至失败或安全硬顶"

target:
  http_base: "http://127.0.0.1:9600"
  ws_url: "ws://127.0.0.1:9600/ws"
  sip_host: "127.0.0.1"
  sip_port: 5060
  sip_transport: udp
  webrtc_public_ip: "127.0.0.1"
  ice_servers:
    - "stun:stun.l.google.com:19302"
  process_name: flowkit

env:
  ASR_PROVIDER: mock
  TTS_PROVIDER: mock
  LLM_PROVIDER: ""
  SIP_KERNEL_AUTO_LLM: "false"
  SIP_EXT_IP: "127.0.0.1"
  SIP_MAX_INBOUND_CALLS: "0"

ramp_policy:
  kind: vertex
  label: "服务器顶点探测"
  description: "按 step 持续加压，直到 R1–R3 失败或 CPU/内存安全阈值；不受 scenario load.max 限制。"
  vertex_hard_ceiling: 5000
  stop_on_cpu_pct: 90
  stop_on_rss_pct_of_ram: 85

safety:
  max_concurrent_cap: 0
  require_mock_providers: true
  confirm_remote: false

preflight:
  check_health: true
  check_metrics: true

# 使用完整场景 YAML（非 quick），无 scenario_overrides
