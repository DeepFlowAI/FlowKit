id: s2_webrtc_offer_quick
name: "S2 · WebRTC 快速验证"
enabled: true

load:
  start: 5
  step: 5
  max: 20
  cps: 5
  hold_seconds: 5
  stagger_ms: 50

success:
  min_rate: 0.95
  max_setup_p99_ms: 5000
  max_loss_pct: 1.0

steady:
  enabled: false
  ratio: 0.8
  duration_seconds: 60

teardown:
  verify_zero_calls: true
  verify_mem_baseline_pct: 15
  wait_seconds: 10

drivers:
  - type: webrtc_offer
    rpc_method: webrtc.offer
