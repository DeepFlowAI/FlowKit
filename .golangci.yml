# Flowkit lint config (golangci-lint v2). CI: .github/workflows/test.yml
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  exclusions:
    generated: lax
    paths:
      - cmd/learn
      - opensource
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: internal/transport/webrtc/peer\.go
        linters:
          - staticcheck
