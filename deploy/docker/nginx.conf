# nginx reverse proxy for flowkit multi-instance deployment.
#
# Routing rules:
#   - WebSocket /ws         → least-conn across the cluster (new sessions)
#   - HTTP /v1/* with ?id=  → consistent hash by ?id= (sticky sessions)
#   - /health, /metrics     → any backend (just probing)
#
# WebRTC media (UDP/SRTP) bypasses nginx entirely — browsers learn the
# pod's INSTANCE_URL from the SDP answer and connect directly. SIP UDP
# (port 5060) also bypasses nginx and requires a SIP-aware LB if used
# across multiple instances.

events {
    worker_connections 1024;
}

http {
    # least_conn distributes brand-new connections (and /v1 lookups without
    # an ?id= argument) to the instance with the fewest active conns.
    upstream flowkit_create {
        least_conn;
        server flowkit-1:9600 max_fails=3 fail_timeout=10s;
        server flowkit-2:9600 max_fails=3 fail_timeout=10s;
        server flowkit-3:9600 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # consistent hash by the ?id= query argument: the same session_id will
    # always reach the same backend even as instances come and go (only
    # 1/N of keys remap when a node is added/removed). nginx 1.7.2+ ships
    # with this built-in.
    upstream flowkit_sticky {
        hash $arg_id consistent;
        server flowkit-1:9600 max_fails=3 fail_timeout=10s;
        server flowkit-2:9600 max_fails=3 fail_timeout=10s;
        server flowkit-3:9600 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Map: pick the right upstream based on whether ?id= is present.
    map $arg_id $flowkit_pool {
        default flowkit_create;
        ~.+     flowkit_sticky;
    }

    server {
        listen 80;
        server_name _;

        # WebSocket upgrade preserved so SDK clients can connect once and
        # stay on the same backend for the lifetime of the call.
        location /ws {
            proxy_pass http://$flowkit_pool;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        # Any HTTP request (/health, /metrics, future /v1/*)
        location / {
            proxy_pass http://$flowkit_pool;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
